server {
    listen 80;
    server_name _;
    
    # Страница-заглушка для маскировки VPN сервера
    # Выглядит как обычный сайт с технической информацией
    
    # Безопасные заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Скрытие версии сервера
    server_tokens off;
    
    # Ограничение запросов (защита от DDoS)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req zone=api burst=20 nodelay;
    
    # Ограничение размера запроса
    client_max_body_size 1M;
    
    # Основная страница-заглушка
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Кеширование статических файлов
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Страницы ошибок
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /var/www/html;
    }
    
    location = /50x.html {
        root /var/www/html;
    }
    
    # Блокировка подозрительных запросов
    location ~* \.(aspx|php|jsp|cgi)$ {
        deny all;
        return 404;
    }
    
    # Блокировка ботов
    if ($http_user_agent ~* (bot|crawl|spider|scraper)) {
        return 403;
    }
    
    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        return 404;
    }
    
    # Запрет доступа к бэкапам и конфигам
    location ~* \.(bak|backup|conf|config|log|sql)$ {
        deny all;
        return 404;
    }
}

# HTTPS конфигурация (если есть SSL сертификат)
server {
    listen 443 ssl http2;
    server_name _;
    
    # SSL сертификаты (замените на свои)
    ssl_certificate /etc/ssl/certs/your-domain.crt;
    ssl_certificate_key /etc/ssl/private/your-domain.key;
    
    # Настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Остальные настройки аналогичны HTTP версии
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    
    server_tokens off;
    
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req zone=api burst=20 nodelay;
    
    client_max_body_size 1M;
    
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /var/www/html;
    }
    
    location = /50x.html {
        root /var/www/html;
    }
    
    location ~* \.(aspx|php|jsp|cgi)$ {
        deny all;
        return 404;
    }
    
    if ($http_user_agent ~* (bot|crawl|spider|scraper)) {
        return 403;
    }
    
    location ~ /\. {
        deny all;
        return 404;
    }
    
    location ~* \.(bak|backup|conf|config|log|sql)$ {
        deny all;
        return 404;
    }
}